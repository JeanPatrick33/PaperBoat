# dro_02 map overlay - Merlee ritual cards
# VRAM: 0x80240000, ROM: 0x9D55A0

:config:
  virtual: [0x80240000, 0x9D55A0]

# Card texture (CI4 32x32)
card:
  { type: TEXTURE, format: CI4, offset: 0x9DCBC8, width: 32, height: 32, symbol: dro_02_card_img }
card.pal:
  { type: TEXTURE, format: TLUT, offset: 0x9DCDC8, colors: 16, symbol: dro_02_card_pal }

# Card vertices
card_1.vtx:
  { type: VTX, offset: 0x9DCDE8, count: 8, symbol: dro_02_card_1_vtx }
card_2.vtx:
  { type: VTX, offset: 0x9DCE68, count: 4, symbol: dro_02_card_2_vtx }

# Card display lists
card_setup.gfx:
  { type: GFX, offset: 0x9DCEA8, size: 0xF0, symbol: dro_02_card_setup_gfx }
card_1.gfx:
  { type: GFX, offset: 0x9DCF98, size: 0x80, symbol: dro_02_card_1_gfx }
card_2.gfx:
  { type: GFX, offset: 0x9DD018, size: 0x48, symbol: dro_02_card_2_gfx }
